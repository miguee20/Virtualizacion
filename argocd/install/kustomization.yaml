apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything is installed in the argocd-mass namespace. Kustomize rewrites the
# namespace of the official manifest (including ClusterRoleBinding subjects).
namespace: argocd-mass

resources:
  - 00-namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
  - 01-ingress.yaml

patches:
  # The ClusterRoleBinding subjects must point to the argocd-mass namespace
  - target:
      kind: ClusterRoleBinding
      name: argocd-.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: argocd-mass
  # Traefik terminates plain HTTP, so argocd-server must not redirect to HTTPS
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
