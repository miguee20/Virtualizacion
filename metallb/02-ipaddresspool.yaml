# IP que MetalLB puede asignar
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: mass-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.49.200/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: mass-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - mass-pool
