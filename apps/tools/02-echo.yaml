apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: parcial-mass
  labels:
    app: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:5678
            - -text=App 4 - http-echo | echo.mass.test | namespace parcial-mass | Miguel Antonio Salguero Sandoval
          ports:
            - containerPort: 5678
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: parcial-mass
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 5678
