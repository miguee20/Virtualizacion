apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Whole monitoring stack (namespace monitoring-mass):
#   kubectl apply -k monitoring/
resources:
  - namespace.yaml
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/deployment.yaml
  - kube-state-metrics/kube-state-metrics.yaml
  - loki/loki.yaml
  - promtail/promtail.yaml
  - grafana/provisioning.yaml
  - grafana/deployment.yaml

# Grafana dashboards (JSON) packaged as a ConfigMap for file provisioning
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring-mass
    files:
      - grafana/dashboards/cluster-metrics.json
      - grafana/dashboards/parcial-mass-logs.json

generatorOptions:
  disableNameSuffixHash: true
